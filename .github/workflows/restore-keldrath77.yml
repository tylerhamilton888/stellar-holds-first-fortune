name: Restore verified Keldrath workspace
on:
  push:
    branches: ['tools/restore-keldrath77']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f333b66eca1914ddf3b699b3cb21da3f4c27f67d
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact verified source and official tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restored"
          git rev-parse HEAD > "$RUNNER_TEMP/restored/source.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/restored/source.txt"
          test "$(git rev-parse HEAD)" = f333b66eca1914ddf3b699b3cb21da3f4c27f67d
          test -z "$(git status --porcelain)"
          tar -czf "$RUNNER_TEMP/restored/source.tar.gz" .
          python3 tools/install_engine.py "$RUNNER_TEMP/restored/godot"
          python3 tools/install_windows_runtime.py "$RUNNER_TEMP/restored/windows_release_x86_64.exe"
          cd "$RUNNER_TEMP/restored"
          sha256sum source.tar.gz windows_release_x86_64.exe godot/Godot_v4.4.1-stable_linux.x86_64 > SHA256SUMS
          split -b 400M source.tar.gz source.part-
          sha256sum source.part-* >> SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-tools-and-manifest
          path: |
            ${{ runner.temp }}/restored/godot/
            ${{ runner.temp }}/restored/windows_release_x86_64.exe
            ${{ runner.temp }}/restored/source.txt
            ${{ runner.temp }}/restored/SHA256SUMS
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-aa
          path: ${{ runner.temp }}/restored/source.part-aa
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-ab
          path: ${{ runner.temp }}/restored/source.part-ab
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-ac
          path: ${{ runner.temp }}/restored/source.part-ac
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-ad
          path: ${{ runner.temp }}/restored/source.part-ad
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-ae
          path: ${{ runner.temp }}/restored/source.part-ae
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-af
          path: ${{ runner.temp }}/restored/source.part-af
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-ag
          path: ${{ runner.temp }}/restored/source.part-ag
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-ah
          path: ${{ runner.temp }}/restored/source.part-ah
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-ai
          path: ${{ runner.temp }}/restored/source.part-ai
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keldrath77-source-aj
          path: ${{ runner.temp }}/restored/source.part-aj
          compression-level: 0
