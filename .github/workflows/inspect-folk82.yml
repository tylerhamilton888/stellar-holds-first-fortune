name: Character source inspection
on:
  push:
    branches: [feature/folk82]
    paths: [tools/inspect_folk82.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install Pillow
      - run: python3 tools/inspect_folk82.py
