name: Recover royal hall source
on:
  push:
    branches: [recovery/royal79-transfer]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify every file and restore the exact reviewed source tree
        run: python3 recovery-transfer/assemble.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: royal79-recovery-receipt
          path: recovery-receipt.json
