name: Verified Windows release
on:
  push:
    branches: ['release/*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    # Includes waiting for the full source gate, a cold art import and exact-pack checks.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 8
      - name: Check version and preserve existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'from tools.build import metadata; print(metadata()["VERSION"])')
          test "$GITHUB_REF_NAME" = "release/$VERSION"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install and verify official engine and Windows runtime
        run: |
          python3 tools/install_engine.py "$RUNNER_TEMP/godot"
          python3 tools/install_windows_runtime.py "$RUNNER_TEMP/windows_release_x86_64.exe"
      # Prepare the clean package while the identical-source gate runs elsewhere.
      - name: Build one complete Windows ZIP
        run: python3 tools/build.py --godot "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --windows-runtime "$RUNNER_TEMP/windows_release_x86_64.exe" --output "$RUNNER_TEMP/windows-build"
      - name: Native gameplay and save verification
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFIED=""
          # A release-only/documentation commit may reuse the existing full gate
          # only when every other tracked file is byte-identical to its source.
          for SOURCE in $(git log -8 --format=%H); do
            if ! git diff --quiet "$SOURCE" HEAD -- . ':(exclude)docs/**' ':(exclude)SESSION_HANDOFF.md' ':(exclude).github/workflows/windows-release.yml'; then
              continue
            fi
            CHECK=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$SOURCE" -f event=pull_request --jq '[.workflow_runs[] | select(.path == ".github/workflows/validate.yml")][0] // empty')
            test -n "$CHECK" || continue
            # Wait for that exact source instead of launching a duplicate suite.
            for ATTEMPT in $(seq 1 180); do
              test "$(echo "$CHECK" | jq -r .status)" = completed && break
              sleep 15
              CHECK=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$(echo "$CHECK" | jq -r .id)")
            done
            if test "$(echo "$CHECK" | jq -r .conclusion)" != success; then
              echo "The identical source gate did not pass; release remains blocked."
              exit 1
            fi
            RUN=$(echo "$CHECK" | jq -r .html_url)
            if test -n "$RUN"; then
              VERIFIED="$SOURCE $RUN"
              break
            fi
          done
          if test -n "$VERIFIED"; then
            mkdir -p test-results
            echo "Identical source passed full native gameplay: $VERIFIED" | tee test-results/release-source.txt
          else
            xvfb-run -a python3 tools/check.py --godot "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --suite gameplay --output test-results/release
          fi
      - name: Test the exact exported pack
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tools/check_pack.py --godot "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --pack "$RUNNER_TEMP/windows-build/FirstFortune.pck" --output test-results/pack
      - name: Publish the verified version without replacing older builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "$RUNNER_TEMP/windows-build/Stellar-Holds-First-Fortune-$VERSION-Windows.zip" "$RUNNER_TEMP/windows-build/build.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "The Stellar Holds — $VERSION" --notes-file docs/RELEASE_NOTES.md
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 14
