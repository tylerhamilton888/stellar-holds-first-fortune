name: Game validation
on:
  push:
    branches: [main]
    paths: [project.godot, "scripts/**", "tests/**", "tools/**", "assets/**", "audio/**"]
  pull_request:
    paths: [project.godot, "scripts/**", "tests/**", "tools/**", "assets/**", "audio/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned official engine
        run: python3 tools/install_engine.py "$RUNNER_TEMP/godot"
      - name: Native gameplay, menus and isolated save regressions
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tools/check.py --godot "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --suite gameplay --output test-results/ci
      - name: Log workstation lesson visual evidence
        if: always()
        run: python3 tools/print_worksite_evidence.py
      - name: Retain evidence
        if: always()
        # Test failures still fail the preceding step. An account artifact quota
        # must not misreport a passing gameplay run as a gameplay failure.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gameplay-evidence-${{ github.sha }}
          path: test-results/ci
          retention-days: 7
  worksite-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned official engine
        run: python3 tools/install_engine.py "$RUNNER_TEMP/godot"
      - name: Verify and capture workstation quest
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tools/check.py --godot "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --suite workstation-preview --output test-results/ci
      - name: Retain readable visual evidence
        if: always()
        run: python3 tools/print_worksite_evidence.py
