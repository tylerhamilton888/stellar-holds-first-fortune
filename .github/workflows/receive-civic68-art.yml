name: Receive original civic art
on:
  push:
    branches: ['asset/keldrath68']
permissions:
  contents: write
jobs:
  receive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and register original image blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          root=Path('art-transfer68')
          for item in json.loads((root/'manifest.json').read_text()):
              raw=base64.b64decode(''.join((root/c).read_text() for c in item['chunks']),validate=True)
              assert len(raw)==item['size']
              assert hashlib.sha256(raw).hexdigest()==item['sha256']
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==item['git_sha']
              data=json.dumps(dict(content=base64.b64encode(raw).decode(),encoding='base64')).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response: result=json.load(response)
              assert result['sha']==item['git_sha']
              print(item['file'],len(raw),result['sha'],item['sha256'])
          PY
